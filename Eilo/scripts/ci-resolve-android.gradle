// CI preparation only: resolve the same app classpaths before single-run builds/tests.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) { return }
    gradle.rootProject.tasks.register('ciResolveAndroidDependencies') {
        doLast {
            ['debugCompileClasspath', 'debugRuntimeClasspath',
             'releaseCompileClasspath', 'releaseRuntimeClasspath',
             'debugUnitTestCompileClasspath', 'debugUnitTestRuntimeClasspath'].each { name ->
                app.configurations.getByName(name).incoming.artifactView {
                    componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                    attributes {
                        attribute(org.gradle.api.artifacts.type.ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'android-classes-jar')
                    }
                }.files.files
            }
        }
    }
}
