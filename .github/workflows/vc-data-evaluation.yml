name: VC-DATA synthetic evaluation
on:
  pull_request:
    paths: ['Eilo/scripts/test_gitleaks_framework.py', 'Eilo/packages/asr-runtime/**', 'Eilo/scripts/ci-dependencies.py', 'Eilo/scripts/ci-resolve-android.gradle', 'Eilo/scripts/test_ci_dependencies.py', '.github/workflows/s01-foundation.yml', 'Eilo/packages/asr-calibration/**', 'Eilo/packages/ios-privacy-audit/**', 'Eilo/packages/dependency-notices/**', 'Eilo/packages/build-inventory/**', 'Eilo/packages/asr-fresh-split/**', 'Eilo/packages/asr-corpus-score/**', 'Eilo/packages/asr-sdk-score-probe/**', 'Eilo/packages/asr-confidence-probe/**', 'Eilo/packages/physical-ios-trial/**', 'Eilo/packages/conversation-integration/**', 'Eilo/packages/dataset-evaluation/**', 'Eilo/packages/vad-runtime/**', 'Eilo/packages/native-test-seam/**', 'Eilo/apps/mobile/android/app/src/**', '.github/workflows/vc-data-evaluation.yml']
  push:
    branches: ['sprint/**', 'task/vc-data-**', 'task/vc-turn-04-**']
    paths: ['Eilo/scripts/test_gitleaks_framework.py', 'Eilo/packages/asr-runtime/**', 'Eilo/scripts/ci-dependencies.py', 'Eilo/scripts/ci-resolve-android.gradle', 'Eilo/scripts/test_ci_dependencies.py', '.github/workflows/s01-foundation.yml', 'Eilo/packages/asr-calibration/**', 'Eilo/packages/ios-privacy-audit/**', 'Eilo/packages/dependency-notices/**', 'Eilo/packages/build-inventory/**', 'Eilo/packages/asr-fresh-split/**', 'Eilo/packages/asr-corpus-score/**', 'Eilo/packages/asr-sdk-score-probe/**', 'Eilo/packages/asr-confidence-probe/**', 'Eilo/packages/physical-ios-trial/**', 'Eilo/packages/conversation-integration/**', 'Eilo/packages/dataset-evaluation/**', 'Eilo/packages/vad-runtime/**', 'Eilo/packages/native-test-seam/**', 'Eilo/apps/mobile/android/app/src/**', '.github/workflows/vc-data-evaluation.yml']
permissions:
  contents: read
concurrency:
  group: vc-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Eilo/packages/dataset-evaluation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and verify registry
        run: |
          python3 -m compileall -q .
          python3 manifests.py
      - name: Deterministic synthetic tests (no corpora/models/microphone)
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s ../../tools/model-pack -p test_fetch_comparison_source.py -v
          python3 -O -m unittest discover -s ../../tools/model-pack -p test_fetch_comparison_source.py -v
          python3 -O -m unittest discover -s tests -v
      - name: Native ASR probability math and pinned synthetic evidence (no downloads)
        run: |
          python3 -m unittest discover -s ../asr-confidence-probe -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-confidence-probe -p 'test_*.py' -v
          python3 ../asr-confidence-probe/report.py
          python3 -O ../asr-confidence-probe/report.py
      - name: SDK decode path scores and fail-closed evidence (no downloads)
        run: |
          python3 -m unittest discover -s ../asr-sdk-score-probe -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-sdk-score-probe -p 'test_*.py' -v
          python3 ../asr-sdk-score-probe/report.py
          python3 -O ../asr-sdk-score-probe/report.py
      - name: Common Voice score aggregates and privacy contracts (no corpus download)
        run: |
          python3 -m unittest discover -s ../asr-corpus-score -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-corpus-score -p 'test_*.py' -v
          python3 ../asr-corpus-score/report.py
          python3 -O ../asr-corpus-score/report.py --output "$RUNNER_TEMP/asr-corpus-score"
          python3 ../asr-corpus-score/noise_report.py --output "$RUNNER_TEMP/asr-noise-score"
          python3 -O ../asr-corpus-score/noise_report.py --output "$RUNNER_TEMP/asr-noise-score-optimized"
      - name: Fresh curator dev/test diagnostics (no corpus download)
        run: |
          python3 -m unittest discover -s ../asr-fresh-split -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-fresh-split -p 'test_*.py' -v
          python3 ../asr-fresh-split/fresh_report.py --output "$RUNNER_TEMP/asr-fresh-split"
          python3 -O ../asr-fresh-split/fresh_report.py
      - name: Frozen development calibrator pilot (no corpus or model access)
        run: |
          python3 -m unittest discover -s ../asr-calibration -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-calibration -p 'test_*.py' -v
          python3 ../asr-calibration/calibration_report.py --output "$RUNNER_TEMP/asr-calibration"
          python3 -O ../asr-calibration/calibration_report.py
          python3 ../asr-calibration/noise_pilot_report.py --output "$RUNNER_TEMP/asr-calibration-noise"
          python3 -O ../asr-calibration/noise_pilot_report.py
          python3 ../asr-calibration/negative_report.py --output "$RUNNER_TEMP/asr-negative-controls"
          python3 -O ../asr-calibration/negative_report.py
      - name: ASR framework packaging observations (no native cache access)
        run: |
          python3 -m unittest discover -s ../asr-runtime -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-runtime -p 'test_*.py' -v
          python3 ../asr-runtime/framework_report.py --output "$RUNNER_TEMP/asr-framework"
          python3 -O ../asr-runtime/framework_report.py
          python3 ../asr-runtime/app_framework_report.py --output "$RUNNER_TEMP/app-framework"
          python3 -O ../asr-runtime/app_framework_report.py
      - name: Normal build inventory contracts (no artifact or dependency downloads)
        run: |
          python3 -m unittest discover -s ../build-inventory -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../build-inventory -p 'test_*.py' -v
          python3 ../build-inventory/inventory_report.py --output "$RUNNER_TEMP/build-inventory"
          python3 -O ../build-inventory/inventory_report.py
      - name: Cached dependency notice provenance (no cache or dependency downloads)
        run: |
          python3 -m unittest discover -s ../dependency-notices -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../dependency-notices -p 'test_*.py' -v
          python3 ../dependency-notices/notice_report.py --output "$RUNNER_TEMP/dependency-notices"
          python3 -O ../dependency-notices/notice_report.py
      - name: Pinned iOS privacy declarations (no artifact or tool downloads)
        run: |
          python3 -m unittest discover -s ../ios-privacy-audit -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../ios-privacy-audit -p 'test_*.py' -v
          python3 ../ios-privacy-audit/report.py --output "$RUNNER_TEMP/ios-privacy-audit"
          python3 -O ../ios-privacy-audit/report.py
      - name: Native VAD sanitizer contracts (no models or capture)
        run: |
          python3 -m compileall -q ../vad-runtime
          python3 ../vad-runtime/check_contract.py
          python3 -m unittest discover -s ../vad-runtime -p test_installer_validation.py -v
          python3 -O -m unittest discover -s ../vad-runtime -p test_installer_validation.py -v
          python3 ../vad-runtime/check_installer_evidence.py
          python3 -O ../vad-runtime/check_installer_evidence.py
          python3 -m unittest discover -s ../vad-runtime -p test_android_installer.py -v
          python3 -O -m unittest discover -s ../vad-runtime -p test_android_installer.py -v
          python3 ../vad-runtime/check_android_installer_evidence.py
          python3 -O ../vad-runtime/check_android_installer_evidence.py
          python3 -m unittest discover -s ../conversation-integration -p 'test_capture*.py' -v
          python3 -O -m unittest discover -s ../conversation-integration -p 'test_capture*.py' -v
          python3 ../conversation-integration/check_capture_evidence.py
          python3 -O ../conversation-integration/check_capture_evidence.py
          python3 ../conversation-integration/check_capture_android_evidence.py
          python3 -O ../conversation-integration/check_capture_android_evidence.py
          python3 ../conversation-integration/framework_capture_report.py --output "$RUNNER_TEMP/framework-capture"
          python3 -O ../conversation-integration/framework_capture_report.py
          python3 ../conversation-integration/framework_noise_report.py --output "$RUNNER_TEMP/framework-noise"
          python3 -O ../conversation-integration/framework_noise_report.py
          python3 -m unittest discover -s ../conversation-integration -p test_speech_android.py -v
          python3 -O -m unittest discover -s ../conversation-integration -p test_speech_android.py -v
          python3 ../conversation-integration/check_speech_android_evidence.py
          python3 -O ../conversation-integration/check_speech_android_evidence.py
          python3 -m unittest discover -s ../physical-ios-trial -p test_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_model_quality_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_model_quality_report.py -v
          python3 ../physical-ios-trial/model_quality_report.py --pair ../physical-ios-trial/tests/model-quality-operator-results.json
          python3 -O ../physical-ios-trial/model_quality_report.py --pair ../physical-ios-trial/tests/model-quality-operator-results.json
          python3 ../physical-ios-trial/phase_report.py --pair ../physical-ios-trial/tests/native-phase-device-results.json
          python3 -O ../physical-ios-trial/phase_report.py --pair ../physical-ios-trial/tests/native-phase-device-results.json
          python3 -m unittest discover -s ../physical-ios-trial -p test_phase_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_phase_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_resident_report_v1.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_resident_report_v1.py -v
          python3 ../physical-ios-trial/resident_report_v1.py ../physical-ios-trial/tests/resident-initial-thermal-limit-results.json
          python3 -O ../physical-ios-trial/resident_report_v1.py ../physical-ios-trial/tests/resident-initial-thermal-limit-results.json
          python3 ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-interrupted-25-results.json
          python3 -O ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-interrupted-25-results.json
          python3 ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-model-device-results.json
          python3 -O ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-model-device-results.json
          python3 -m unittest discover -s ../physical-ios-trial -p 'test_network*.py' -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p 'test_network*.py' -v
          python3 ../physical-ios-trial/network_observation_report.py ../physical-ios-trial/tests/network-observation-attempt.json
          python3 -O ../physical-ios-trial/network_observation_report.py ../physical-ios-trial/tests/network-observation-attempt.json
          python3 -m unittest discover -s ../physical-ios-trial -p test_rvi_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_rvi_report.py -v
          python3 ../physical-ios-trial/rvi_report.py ../physical-ios-trial/tests/network-rvi-preflight-results.json ../physical-ios-trial/tests/network-rvi-calibration-results.json --json-output "$RUNNER_TEMP/eilo-rvi-review.json" --html-output "$RUNNER_TEMP/eilo-rvi-review.html"
          python3 -O ../physical-ios-trial/rvi_report.py ../physical-ios-trial/tests/network-rvi-preflight-results.json ../physical-ios-trial/tests/network-rvi-calibration-results.json
          python3 -m unittest discover -s ../physical-ios-trial -p test_resident_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_resident_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_resident_wrapper.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_resident_wrapper.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_phase_wrapper.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_phase_wrapper.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_model_wrapper.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_model_wrapper.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_model_diagnostic_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_model_diagnostic_report.py -v
          python3 ../physical-ios-trial/model_diagnostic_report.py --pair ../physical-ios-trial/tests/cpu-model-device-results.json
          python3 -O ../physical-ios-trial/model_diagnostic_report.py --pair ../physical-ios-trial/tests/cpu-model-device-results.json
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_lifecycle_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_lifecycle_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_permission_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_permission_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_voice_survey.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_voice_survey.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_file_asr_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_file_asr_report.py -v
          python3 ../physical-ios-trial/voice_survey.py ../physical-ios-trial/tests/listening-survey-operator-results.json
          python3 -O ../physical-ios-trial/voice_survey.py ../physical-ios-trial/tests/listening-survey-operator-results.json
          python3 ../physical-ios-trial/file_asr_report.py ../physical-ios-trial/tests/file-asr-device-results.json
          python3 -O ../physical-ios-trial/file_asr_report.py ../physical-ios-trial/tests/file-asr-device-results.json
          python3 ../vad-runtime/generate_rate_filter.py --check
          python3 -O ../vad-runtime/generate_rate_filter.py --check
      - name: Generate privacy-reduced synthetic JSON and HTML
        run: python3 smoke.py --output "$RUNNER_TEMP/vc-data-reports"
      - name: Upload redacted blocked RVI review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-rvi-blocked-review
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/eilo-rvi-review.json
            ${{ runner.temp }}/eilo-rvi-review.html
      - name: Upload only synthetic aggregate summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vc-data-synthetic-summaries
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/vc-data-reports/summary.json
            ${{ runner.temp }}/vc-data-reports/summary.html
            ${{ runner.temp }}/vc-data-reports/not-run/summary.json
            ${{ runner.temp }}/vc-data-reports/not-run/summary.html
            ${{ runner.temp }}/vc-data-reports/regression.json
      - name: Upload aggregate-only corpus diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asr-corpus-score-aggregates
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-corpus-score/summary.json
            ${{ runner.temp }}/asr-corpus-score/summary.html
      - name: Upload aggregate-only paired noise diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asr-noise-score-aggregates
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-noise-score/summary.json
            ${{ runner.temp }}/asr-noise-score/summary.html
      - name: Upload aggregate-only fresh split diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asr-fresh-split-aggregates
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-fresh-split/summary.json
            ${{ runner.temp }}/asr-fresh-split/summary.html
      - name: Upload observed inventory summaries only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: normal-build-inventory
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/build-inventory/summary.json
            ${{ runner.temp }}/build-inventory/summary.html
      - name: Upload notice provenance summaries only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-notice-provenance
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dependency-notices/summary.json
            ${{ runner.temp }}/dependency-notices/summary.html
      - name: Upload iOS declaration summaries only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-privacy-declarations
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ios-privacy-audit/summary.json
            ${{ runner.temp }}/ios-privacy-audit/summary.html
      - name: Upload aggregate-only calibration pilot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asr-calibration-pilot
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-calibration/summary.json
            ${{ runner.temp }}/asr-calibration/summary.html
      - name: Upload aggregate-only frozen calibrator noise comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asr-calibration-noise
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-calibration-noise/summary.json
            ${{ runner.temp }}/asr-calibration-noise/summary.html
      - name: Upload aggregate-only direct ASR negative controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asr-negative-controls
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-negative-controls/summary.json
            ${{ runner.temp }}/asr-negative-controls/summary.html
      - name: Upload aggregate-only ASR framework observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-asr-framework
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/asr-framework/summary.json
            ${{ runner.temp }}/asr-framework/summary.html

      - name: Upload joined framework simulator observations
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-capture
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/framework-capture/summary.json
            ${{ runner.temp }}/framework-capture/summary.html

      - name: Upload unsigned simulator app framework observations
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-framework
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/app-framework/summary.json
            ${{ runner.temp }}/app-framework/summary.html

      - name: Upload paired iOS VAD ASR noise observations
        uses: actions/upload-artifact@v4
        with:
          name: ios-vad-asr-noise-pairs
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/framework-noise/summary.json
            ${{ runner.temp }}/framework-noise/summary.html
