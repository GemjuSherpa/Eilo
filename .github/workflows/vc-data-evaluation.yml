name: VC-DATA synthetic evaluation
on:
  pull_request:
    paths: ['Eilo/packages/asr-confidence-probe/**', 'Eilo/packages/physical-ios-trial/**', 'Eilo/packages/conversation-integration/**', 'Eilo/packages/dataset-evaluation/**', 'Eilo/packages/vad-runtime/**', 'Eilo/packages/native-test-seam/**', 'Eilo/apps/mobile/android/app/src/**', '.github/workflows/vc-data-evaluation.yml']
  push:
    branches: ['sprint/**', 'task/vc-data-**', 'task/vc-turn-04-**']
    paths: ['Eilo/packages/asr-confidence-probe/**', 'Eilo/packages/physical-ios-trial/**', 'Eilo/packages/conversation-integration/**', 'Eilo/packages/dataset-evaluation/**', 'Eilo/packages/vad-runtime/**', 'Eilo/packages/native-test-seam/**', 'Eilo/apps/mobile/android/app/src/**', '.github/workflows/vc-data-evaluation.yml']
permissions:
  contents: read
concurrency:
  group: vc-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Eilo/packages/dataset-evaluation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and verify registry
        run: |
          python3 -m compileall -q .
          python3 manifests.py
      - name: Deterministic synthetic tests (no corpora/models/microphone)
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s ../../tools/model-pack -p test_fetch_comparison_source.py -v
          python3 -O -m unittest discover -s ../../tools/model-pack -p test_fetch_comparison_source.py -v
          python3 -O -m unittest discover -s tests -v
      - name: Native ASR probability math and pinned synthetic evidence (no downloads)
        run: |
          python3 -m unittest discover -s ../asr-confidence-probe -p 'test_*.py' -v
          python3 -O -m unittest discover -s ../asr-confidence-probe -p 'test_*.py' -v
          python3 ../asr-confidence-probe/report.py
          python3 -O ../asr-confidence-probe/report.py
      - name: Native VAD sanitizer contracts (no models or capture)
        run: |
          python3 -m compileall -q ../vad-runtime
          python3 ../vad-runtime/check_contract.py
          python3 -m unittest discover -s ../vad-runtime -p test_installer_validation.py -v
          python3 -O -m unittest discover -s ../vad-runtime -p test_installer_validation.py -v
          python3 ../vad-runtime/check_installer_evidence.py
          python3 -O ../vad-runtime/check_installer_evidence.py
          python3 -m unittest discover -s ../vad-runtime -p test_android_installer.py -v
          python3 -O -m unittest discover -s ../vad-runtime -p test_android_installer.py -v
          python3 ../vad-runtime/check_android_installer_evidence.py
          python3 -O ../vad-runtime/check_android_installer_evidence.py
          python3 -m unittest discover -s ../conversation-integration -p 'test_capture*.py' -v
          python3 -O -m unittest discover -s ../conversation-integration -p 'test_capture*.py' -v
          python3 ../conversation-integration/check_capture_evidence.py
          python3 -O ../conversation-integration/check_capture_evidence.py
          python3 ../conversation-integration/check_capture_android_evidence.py
          python3 -O ../conversation-integration/check_capture_android_evidence.py
          python3 -m unittest discover -s ../conversation-integration -p test_speech_android.py -v
          python3 -O -m unittest discover -s ../conversation-integration -p test_speech_android.py -v
          python3 ../conversation-integration/check_speech_android_evidence.py
          python3 -O ../conversation-integration/check_speech_android_evidence.py
          python3 -m unittest discover -s ../physical-ios-trial -p test_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_model_quality_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_model_quality_report.py -v
          python3 ../physical-ios-trial/model_quality_report.py --pair ../physical-ios-trial/tests/model-quality-operator-results.json
          python3 -O ../physical-ios-trial/model_quality_report.py --pair ../physical-ios-trial/tests/model-quality-operator-results.json
          python3 ../physical-ios-trial/phase_report.py --pair ../physical-ios-trial/tests/native-phase-device-results.json
          python3 -O ../physical-ios-trial/phase_report.py --pair ../physical-ios-trial/tests/native-phase-device-results.json
          python3 -m unittest discover -s ../physical-ios-trial -p test_phase_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_phase_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_resident_report_v1.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_resident_report_v1.py -v
          python3 ../physical-ios-trial/resident_report_v1.py ../physical-ios-trial/tests/resident-initial-thermal-limit-results.json
          python3 -O ../physical-ios-trial/resident_report_v1.py ../physical-ios-trial/tests/resident-initial-thermal-limit-results.json
          python3 ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-interrupted-25-results.json
          python3 -O ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-interrupted-25-results.json
          python3 ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-model-device-results.json
          python3 -O ../physical-ios-trial/resident_report.py ../physical-ios-trial/tests/resident-model-device-results.json
          python3 -m unittest discover -s ../physical-ios-trial -p 'test_network*.py' -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p 'test_network*.py' -v
          python3 ../physical-ios-trial/network_observation_report.py ../physical-ios-trial/tests/network-observation-attempt.json
          python3 -O ../physical-ios-trial/network_observation_report.py ../physical-ios-trial/tests/network-observation-attempt.json
          python3 -m unittest discover -s ../physical-ios-trial -p test_rvi_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_rvi_report.py -v
          python3 ../physical-ios-trial/rvi_report.py ../physical-ios-trial/tests/network-rvi-preflight-results.json ../physical-ios-trial/tests/network-rvi-calibration-results.json --json-output "$RUNNER_TEMP/eilo-rvi-review.json" --html-output "$RUNNER_TEMP/eilo-rvi-review.html"
          python3 -O ../physical-ios-trial/rvi_report.py ../physical-ios-trial/tests/network-rvi-preflight-results.json ../physical-ios-trial/tests/network-rvi-calibration-results.json
          python3 -m unittest discover -s ../physical-ios-trial -p test_resident_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_resident_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_resident_wrapper.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_resident_wrapper.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_phase_wrapper.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_phase_wrapper.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_model_wrapper.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_model_wrapper.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_model_diagnostic_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_model_diagnostic_report.py -v
          python3 ../physical-ios-trial/model_diagnostic_report.py --pair ../physical-ios-trial/tests/cpu-model-device-results.json
          python3 -O ../physical-ios-trial/model_diagnostic_report.py --pair ../physical-ios-trial/tests/cpu-model-device-results.json
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_report.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_voice_survey.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_voice_survey.py -v
          python3 -m unittest discover -s ../physical-ios-trial -p test_file_asr_report.py -v
          python3 -O -m unittest discover -s ../physical-ios-trial -p test_file_asr_report.py -v
          python3 ../physical-ios-trial/voice_survey.py ../physical-ios-trial/tests/listening-survey-operator-results.json
          python3 -O ../physical-ios-trial/voice_survey.py ../physical-ios-trial/tests/listening-survey-operator-results.json
          python3 ../physical-ios-trial/file_asr_report.py ../physical-ios-trial/tests/file-asr-device-results.json
          python3 -O ../physical-ios-trial/file_asr_report.py ../physical-ios-trial/tests/file-asr-device-results.json
          python3 ../vad-runtime/generate_rate_filter.py --check
          python3 -O ../vad-runtime/generate_rate_filter.py --check
      - name: Generate privacy-reduced synthetic JSON and HTML
        run: python3 smoke.py --output "$RUNNER_TEMP/vc-data-reports"
      - name: Upload redacted blocked RVI review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-rvi-blocked-review
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/eilo-rvi-review.json
            ${{ runner.temp }}/eilo-rvi-review.html
      - name: Upload only synthetic aggregate summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vc-data-synthetic-summaries
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/vc-data-reports/summary.json
            ${{ runner.temp }}/vc-data-reports/summary.html
            ${{ runner.temp }}/vc-data-reports/not-run/summary.json
            ${{ runner.temp }}/vc-data-reports/not-run/summary.html
            ${{ runner.temp }}/vc-data-reports/regression.json
