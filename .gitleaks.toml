[extend]
useDefault = true

[[allowlists]]
description = "Generated dependency/build directories and public Android template debug keystore"
paths = ['''(^|/)(node_modules|Pods|vendor|build|\.build|\.gradle|\.cxx)/''', '''(^|/)debug\.keystore$''']

[[allowlists]]
description = "CocoaPods public lockfile integrity checksums, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)Podfile\.lock$''']
regexTarget = "line"
regexes = ['''^PODFILE CHECKSUM: [0-9a-f]{40}$''', '''^\s*React-cxxstableapi: [0-9a-f]{40}$''']

[[allowlists]]
description = "Wake evaluation APK library SHA256 evidence, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Eilo/packages/wake-runtime/tests/android-package-results\.json$''']
regexTarget = "line"
regexes = ['''^\s*"lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/lib(onnxruntime|sherpa-onnx-c-api|eilo_wake_jni)\.so": "[0-9a-f]{64}",?$''']

[[allowlists]]
description = "Native ASR regression source-file SHA256, not an authentication credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Eilo/packages/vad-runtime/tests/asr-handoff-native-regression\.json$''']
regexTarget = "line"
regexes = ['''^\s*"packages/native-test-seam/Sources/NativeTestSeam/IOSConsentAuthentication\.swift": "[0-9a-f]{64}",?$''']
